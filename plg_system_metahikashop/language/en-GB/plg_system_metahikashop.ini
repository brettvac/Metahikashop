PLG_SYSTEM_METAHIKASHOP="System - Meta Pixel & cAPI for HikaShop"
PLG_SYSTEM_METAHIKASHOP_XML_DESCRIPTION="Integrates HikaShop with Meta Pixel and the Conversions API (CAPI) to track PageView, ViewContent, InitiateCheckout, and Purchase events. Supports browser-side and server-side event tracking, event deduplication, and order conversion tracking."
PLG_SYSTEM_METAHIKASHOP_DATASET_ID="Dataset ID"
PLG_SYSTEM_METAHIKASHOP_DATASET_ID_DESC="Your Meta Dataset ID (formerly called Pixel ID). Found in Events Manager → Data Sources → Settings."
PLG_SYSTEM_METAHIKASHOP_ACCESS_TOKEN="Access Token"
PLG_SYSTEM_METAHIKASHOP_ACCESS_TOKEN_DESC="A permanent System User access token. Generate it in Business Settings → System Users or under Dataset Settings → Conversions API."
PLG_SYSTEM_METAHIKASHOP_TEST_EVENT_CODE="Test Event Code"
PLG_SYSTEM_METAHIKASHOP_TEST_EVENT_CODE_DESC="Optional. Enter the code shown in Events Manager → Test Events (e.g. TEST12345). Leave empty for production."
PLG_SYSTEM_METAHIKASHOP_ONLY_CONFIRMED="Only confirmed orders (CAPI Purchase)"
PLG_SYSTEM_METAHIKASHOP_ONLY_CONFIRMED_DESC="When enabled, the server-side Purchase event is sent only when an order changes from a non-invoice status to an invoice status (confirmed or shipped by default). When disabled, the event can be sent whenever an eligible order is processed in an invoice status, without requiring a status change. Each order is tracked to prevent duplicate events."
PLG_SYSTEM_METAHIKASHOP_DEBUG="Debug mode"
PLG_SYSTEM_METAHIKASHOP_DEBUG_DESC="When enabled, event payloads and API responses are written to the HikaShop log. Disable in production."
PLG_SYSTEM_METAHIKASHOP_JS_EVENTS="JavaScript Pixel Events"
PLG_SYSTEM_METAHIKASHOP_JS_PAGEVIEW="PageView (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_PAGEVIEW_DESC="Fire the standard PageView event via the Meta Pixel on every page where the Pixel is initialized."
PLG_SYSTEM_METAHIKASHOP_JS_VIEWCONTENT="ViewContent (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_VIEWCONTENT_DESC="Fire ViewContent on HikaShop product pages."
PLG_SYSTEM_METAHIKASHOP_JS_INITIATECHECKOUT="InitiateCheckout (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_INITIATECHECKOUT_DESC="Fire InitiateCheckout when the customer starts the checkout process."
PLG_SYSTEM_METAHIKASHOP_JS_PURCHASE="Purchase (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_PURCHASE_DESC="Fire Purchase on the thank-you / order confirmation page. Uses the same event_id as the server-side event for proper deduplication."
PLG_SYSTEM_METAHIKASHOP_CAPI_EVENTS="Server-side Conversions API Events"
PLG_SYSTEM_METAHIKASHOP_CAPI_PAGEVIEW="PageView (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_PAGEVIEW_DESC="Currently not implemented. PageView is almost always better handled by the browser Pixel."
PLG_SYSTEM_METAHIKASHOP_CAPI_VIEWCONTENT="ViewContent (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_VIEWCONTENT_DESC="Currently not implemented. Reserved for future server-side ViewContent support."
PLG_SYSTEM_METAHIKASHOP_CAPI_INITIATECHECKOUT="InitiateCheckout (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_INITIATECHECKOUT_DESC="Currently not implemented. Reserved for future server-side InitiateCheckout support."
PLG_SYSTEM_METAHIKASHOP_CAPI_PURCHASE="Purchase (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_PURCHASE_DESC="Send a server-side Purchase event through the Conversions API when an order reaches an invoice status. This is the most important CAPI event and is strongly recommended."
