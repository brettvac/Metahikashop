PLG_SYSTEM_METAHIKASHOP="Plugin système Meta Pixel et API Conversions pour HikaShop"
PLG_SYSTEM_METAHIKASHOP_XML_DESCRIPTION="Intégration pour HikaShop à Meta Pixel et à l’API Conversions (CAPI) afin de suivre les événements PageView, ViewContent, InitiateCheckout et Purchase. Prend en charge le suivi des événements côté navigateur et côté serveur, la déduplication des événements et le suivi des conversions liées aux commandes."
PLG_SYSTEM_METAHIKASHOP_DATASET_ID="ID du jeu de données"
PLG_SYSTEM_METAHIKASHOP_DATASET_ID_DESC="Votre ID de jeu de données Meta (anciennement appelé ID de pixel). Vous le trouverez dans Gestionnaire d’événements → Sources de données → Paramètres."
PLG_SYSTEM_METAHIKASHOP_ACCESS_TOKEN="Jeton d’accès"
PLG_SYSTEM_METAHIKASHOP_ACCESS_TOKEN_DESC="Un jeton d’accès permanent pour un utilisateur système. Générez-le dans Paramètres de l’entreprise → Utilisateurs système ou dans Paramètres du jeu de données → API Conversions."
PLG_SYSTEM_METAHIKASHOP_TEST_EVENT_CODE="Code d’événement de test"
PLG_SYSTEM_METAHIKASHOP_TEST_EVENT_CODE_DESC="Facultatif. Saisissez le code affiché dans Gestionnaire d’événements → Événements de test (p. ex. TEST12345). Laissez ce champ vide en production."
PLG_SYSTEM_METAHIKASHOP_ONLY_CONFIRMED="Commandes confirmées uniquement (Purchase CAPI)"
PLG_SYSTEM_METAHIKASHOP_ONLY_CONFIRMED_DESC="Lorsque cette option est activée, l’événement Purchase côté serveur est envoyé uniquement lorsqu’une commande passe d’un statut non facturable à un statut facturable (confirmée ou expédiée par défaut). Lorsque cette option est désactivée, l’événement peut être envoyé chaque fois qu’une commande admissible est traitée avec un statut facturable, sans nécessiter de changement de statut. Chaque commande est suivie afin d’éviter l’envoi d’événements en double."
PLG_SYSTEM_METAHIKASHOP_DEBUG="Mode débogage"
PLG_SYSTEM_METAHIKASHOP_DEBUG_DESC="Lorsque cette option est activée, les données des événements et les réponses de l’API sont enregistrées dans le journal de HikaShop. Désactivez cette option en production."
PLG_SYSTEM_METAHIKASHOP_JS_EVENTS="Événements Pixel JavaScript"
PLG_SYSTEM_METAHIKASHOP_JS_PAGEVIEW="PageView (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_PAGEVIEW_DESC="Déclenche l’événement standard PageView via Meta Pixel sur chaque page où le pixel est initialisé."
PLG_SYSTEM_METAHIKASHOP_JS_VIEWCONTENT="ViewContent (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_VIEWCONTENT_DESC="Déclenche l’événement ViewContent sur les pages de produits HikaShop."
PLG_SYSTEM_METAHIKASHOP_JS_INITIATECHECKOUT="InitiateCheckout (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_INITIATECHECKOUT_DESC="Déclenche l’événement InitiateCheckout lorsque le client commence le processus de commande."
PLG_SYSTEM_METAHIKASHOP_JS_PURCHASE="Purchase (JS)"
PLG_SYSTEM_METAHIKASHOP_JS_PURCHASE_DESC="Déclenche l’événement Purchase sur la page de remerciement ou de confirmation de commande. Utilise le même event_id que l’événement côté serveur afin d’assurer une déduplication correcte."
PLG_SYSTEM_METAHIKASHOP_CAPI_EVENTS="Événements de l’API Conversions côté serveur"
PLG_SYSTEM_METAHIKASHOP_CAPI_PAGEVIEW="PageView (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_PAGEVIEW_DESC="Actuellement non implémenté. L’événement PageView est presque toujours mieux géré par le pixel côté navigateur."
PLG_SYSTEM_METAHIKASHOP_CAPI_VIEWCONTENT="ViewContent (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_VIEWCONTENT_DESC="Actuellement non implémenté. Réservé à une éventuelle prise en charge future de l’événement ViewContent côté serveur."
PLG_SYSTEM_METAHIKASHOP_CAPI_INITIATECHECKOUT="InitiateCheckout (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_INITIATECHECKOUT_DESC="Actuellement non implémenté. Réservé à une éventuelle prise en charge future de l’événement InitiateCheckout côté serveur."
PLG_SYSTEM_METAHIKASHOP_CAPI_PURCHASE="Purchase (CAPI)"
PLG_SYSTEM_METAHIKASHOP_CAPI_PURCHASE_DESC="Envoie un événement Purchase côté serveur via l’API Conversions lorsqu’une commande atteint un statut facturable. Il s’agit de l’événement CAPI le plus important et son utilisation est fortement recommandée."